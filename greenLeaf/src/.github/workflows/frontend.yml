- name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 22
    cache: npm
    cache-dependency-path: greenLeaf/package-lock.json

- name: Install dependencies
  working-directory: greenLeaf
  run: npm ci

- name: Run Vitest tests
  working-directory: greenLeaf
  run: npm run test

- name: Build production frontend
  working-directory: greenLeaf
  run: npm run build